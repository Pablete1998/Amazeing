[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generator using Recursive Backtracker (DFS)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["maze", "labyrinth", "generator", "algorithm"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mazegen = ["py.typed"]
